[package]
name = "crypto"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
base64 = "0.22.1"
curve25519-dalek = "4.1.3"
der = { version = "0.8.0", features = ["alloc", "arbitrary", "derive", "oid"] }
ecdsa = { version = "0.16.9", features = ["sha2", "signing", "verifying"] }
ed25519-dalek = { version = "2.2.0", features = ["alloc"] }
ff = { version = "0.13.1", features = ["derive"] }
fixed-hash = "0.8.0"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }
group = "0.13.0"
p256 = "0.13.2"
primitive-types = { version = "0.14.0", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11.0"
sha3 = "0.11.0"
subtle = "2.6.1"
wasm-bindgen = "0.2.117"
zeroize = "1.8.2"

[dev-dependencies]
blstrs = "0.7.1"
x509-parser = "0.18.1"
